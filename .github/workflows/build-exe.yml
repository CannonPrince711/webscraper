name: Build Webscraper.exe

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write            # only needed for the release step
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      # npm install, PyInstaller venv, freeze, smoke test — all of it
      - name: Freeze the executable
        shell: pwsh
        run: ./packaging/desktop/build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Webscraper-windows-x64
          path: dist/Webscraper.exe

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title "Webscraper $env:GITHUB_REF_NAME" --generate-notes
          }
          gh release upload $env:GITHUB_REF_NAME dist/Webscraper.exe --clobber
