name: Build Webscraper (portable zip + installer)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this new tag (e.g. v0.3.0). Leave empty to only build.'
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write            # only needed for the release step
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      # One place that decides whether this run publishes, and under which tag:
      # a pushed v* tag, or the manual `release_tag` input. Anything else only builds.
      - name: Resolve release tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          $tag = ''
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $tag = $env:GITHUB_REF_NAME }
          elseif ($env:INPUT_TAG) { $tag = $env:INPUT_TAG.Trim() }
          if ($tag) {
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Release tag '$tag' must look like v1.2.3" }
            if ($env:INPUT_TAG) {
              # Never move or reuse a tag that already exists.
              $existing = git ls-remote --tags origin "refs/tags/$tag"
              if ($existing) { throw "Tag $tag already exists; choose a new version." }
            }
            echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
            echo "WEBSCRAPER_VERSION=$($tag.TrimStart('v'))" >> $env:GITHUB_ENV
          }

      # npm ci, updater tests, PyInstaller, update-swap self-test, Inno Setup,
      # silent install + smoke test of the installed app, checksums.
      - name: Build, test and package
        shell: pwsh
        run: ./packaging/desktop/build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Webscraper-windows-x64
          path: |
            dist/Webscraper-windows-x64-portable.zip
            dist/Webscraper-Setup.exe
            dist/SHA256SUMS.txt

      - name: Publish the release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # --target pins a new tag to exactly the commit that was built.
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title "Webscraper $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          }
          gh release upload $env:RELEASE_TAG dist/Webscraper-windows-x64-portable.zip dist/Webscraper-Setup.exe dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }
